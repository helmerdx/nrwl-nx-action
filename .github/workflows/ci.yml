name: 'ci'

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run lint

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package action
        run: pnpm run package

      - name: Verify packaged files are committed
        run: git diff --exit-code dist

  e2e:
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.report.outputs.report }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run end-to-end tests
        id: test
        env:
          E2E_REPORT_PATH: ${{ runner.temp }}/e2e-report.json
        run: pnpm run test:e2e

      - name: Read end-to-end test report
        id: report
        if: always()
        env:
          E2E_REPORT_PATH: ${{ runner.temp }}/e2e-report.json
        run: |
          if [ -f "$E2E_REPORT_PATH" ]; then
            echo "report=$(cat "$E2E_REPORT_PATH")" >> "$GITHUB_OUTPUT"
          fi

  e2e-report:
    if: >-
      ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Update pull request report
        uses: actions/github-script@v9
        env:
          E2E_REPORT: ${{ needs.e2e.outputs.report }}
        with:
          script: |
            const marker = '<!-- nrwl-nx-action-e2e-report -->';
            const result = '${{ needs.e2e.result }}';
            const report = process.env.E2E_REPORT
              ? JSON.parse(process.env.E2E_REPORT)
              : undefined;
            const workflowUrl =
              context.serverUrl +
              '/' +
              context.repo.owner +
              '/' +
              context.repo.repo +
              '/actions/runs/' +
              context.runId;
            const body = [
              marker,
              result === 'success' ? '✅ All tasks succeeded' : '❌ End-to-end test failed',
              '',
              '## Performance',
              '',
              report ? 'Run duration: ' + report.runDurationMs + 'ms' : 'Run duration: unavailable',
              report ? 'Cache: ' + report.cache : 'Cache: unavailable',
              report
                ? 'Critical path: ' + report.criticalPathMs + 'ms (' + report.taskCount + ' task)'
                : 'Critical path: unavailable',
              report && report.recoverableTimeMs < 1
                ? 'Recoverable time: <1ms'
                : 'Recoverable time: unavailable',
              '',
              '## Vitest Test Report',
              '',
              '### Summary',
              '',
              report
                ? 'Test Files: ✅ ' + report.testFiles.passed + ' pass · ' + report.testFiles.total + ' total'
                : 'Test Files: unavailable',
              report
                ? 'Test Results: ✅ ' + report.testResults.passed + ' pass · ' + report.testResults.total + ' total'
                : 'Test Results: unavailable',
              '',
              '- Commit: `' + context.sha + '`',
              '- [View workflow run](' + workflowUrl + ')',
              '',
              '_This comment is updated after each E2E run._',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previousComment = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker),
            );

            if (previousComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previousComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
